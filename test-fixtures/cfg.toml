version = 1

[[entry]]
name = "notes"
mode = "mirror"
drive = "BACKUP"
source = "~/Documents/notes"
dest = "backup/notes"
exclude = [".DS_Store"]

[[entry]]
name = "audio"
mode = "move"
drive = "BACKUP"
source = "~/recordings"
dest = "backup/audio"
include = ["*.wav"]
min_age_minutes = 5
skip_open = true
